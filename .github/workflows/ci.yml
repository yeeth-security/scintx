name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schema Python deps
        run: pip install -r scripts/requirements-schemas.txt
      - name: Check
        run: |
          chmod +x scripts/*.sh
          CHECK_GENERATED=1 ./scripts/check.sh
