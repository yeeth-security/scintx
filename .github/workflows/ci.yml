name: ci

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: this job only checks out code and runs tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pin to commit SHA (tags are mutable). Dependabot updates these.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Schema Python deps
        run: pip install --require-hashes -r scripts/requirements-schemas.txt
      - name: Check
        run: |
          chmod +x scripts/*.sh
          CHECK_GENERATED=1 ./scripts/check.sh
